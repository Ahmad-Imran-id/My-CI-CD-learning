name: CI workflow

on:
  push:
    branches:
     - main

  pull_requests:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout_code
      uses: actions/checkout/@v2

    - name: python instalation
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install streamlit pytest

    - name: run tests
      run: |
        pytest _test.py



   
